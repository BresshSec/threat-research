title: Suspicious MSHTA Execution with Remote URL
id: 7e35c7de-5a83-4b38-a97f-cfcddf521d91
status: experimental
description: >
  Detects mshta.exe executing content from a remote HTTP or HTTPS URL.
  This behavior was observed during Research #001 involving a ClickFix
  fake CAPTCHA campaign.
author: Andrea Salvadori
date: 2026-09-03

logsource:
  category: process_creation
  product: windows

detection:
  selection_image:
    Image|endswith: '\mshta.exe'

  selection_url:
    CommandLine|contains:
      - 'http://'
      - 'https://'

  condition: selection_image and selection_url

falsepositives:
  - Legitimate applications or administrative scripts using mshta.exe with remote content

level: high

tags:
  - attack.defense-evasion
  - attack.t1218.005
